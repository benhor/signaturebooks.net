<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignatureBooks</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(0,0,0,0.85);
    padding: 12px 8px;
    text-align: center;
    z-index: 1000;
}

nav button {
    background: none;
    border: none;
    color: white;
    font-size: 16px;
    margin: 0 10px;
    cursor: pointer;
}

nav button:hover {
    text-decoration: underline;
}

.page {
    display: none;
    min-height: 100vh;
    padding-top: 55px;
    text-align: center;
}

.page.active {
    display: block;
}

.page img {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
}

@media (max-width: 600px) {
    nav button {
        font-size: 13px;
        margin: 0 4px;
    }
}
</style>
</head>

<body>

<nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('books')">Featured Books</button>
    <button onclick="showPage('about')">About</button>
    <button onclick="showPage('written')">The Written Word</button>
    <button onclick="showPage('contact')">Contact</button>
</nav>

<section id="home" class="page active">
    <img src="1.png" alt="SignatureBooks Home">
</section>

<section id="books" class="page">
    <img src="2.png" alt="SignatureBooks Featured Books">
</section>

<section id="about" class="page">
    <img src="3.png" alt="About SignatureBooks">
</section>

<section id="written" class="page">
    <img src="4.png" alt="The Written Word">
</section>

<section id="contact" class="page">
    <img src="5.png" alt="SignatureBooks Contact">
</section>

<script>
function showPage(pageName) {
    document.querySelectorAll('.page').forEach(function(page) {
        page.classList.remove('active');
    });

    document.getElementById(pageName).classList.add('active');

    window.scrollTo(0, 0);
}
</script>

</body>
</html>
