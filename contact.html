
<form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
  <input type="hidden" name="cmd" value="_xclick">
  <input type="hidden" name="business" value="legacybridge@consultant.com">

  <h3>Select Your Book</h3>

  <label for="book">Book Title:</label>
  <select name="item_name" id="book">
    <option value="Reggae – The Philosophy">Reggae – The Philosophy</option>
    <option value="Good Person">Good Person</option>
    <option value="Coping with Prostate">Coping with Prostate</option>
    <option value="Angry White Male">Angry White Male</option>
    <option value="Second Chance">Second Chance</option>
    <option value="Leave the Church">Leave the Church</option>
    <option value="Happiness">Happiness</option>
    <option value="Orgasm">Orgasm</option>
    <option value="The PLOT">The PLOT</option>
    <option value="New South">New South</option>
    <option value="Black America">Black America</option>
  </select>

  <br><br>

  <label for="format">Format:</label>
  <select name="format" id="format">
    <option value="Hardcover">Hardcover – $17.99</option>
    <option value="Perfectbound">Perfectbound – $12.99</option>
    <option value="Ebook">Ebook – $2.99</option>
  </select>

  <input type="hidden" name="currency_code" value="USD">

  <br><br>

  <label for="amount">Price:</label>
  <input type="text" name="amount" id="amount" value="17.99" readonly>

  <script>
    const prices = {
      "Hardcover": "17.99",
      "Perfectbound": "12.99",
      "Ebook": "2.99"
    };

    document.getElementById("format").addEventListener("change", function() {
      document.getElementById("amount").value = prices[this.value];
    });
  </script>

  <br><br>

  <button type="submit" style="padding:10px 20px; font-size:16px;">
    Buy Now
  </button>
</form>
